<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>facebook-style.css — Demo</title>
<link rel="stylesheet" href="facebook-style.css">
</head>
<body>

<div class="fb-navbar">
  <span class="brand">facelike</span>
  <span class="search">Search facelike</span>
  <div class="d-flex gap-2">
    <button class="icon-btn">🔔</button>
    <button class="icon-btn">💬</button>
    <button class="icon-btn">☰</button>
  </div>
</div>

<div class="fb-shell">
  <div class="fb-sidebar">
    <div class="side-item"><div class="icon"></div> Friends</div>
    <div class="side-item"><div class="icon"></div> Groups</div>
    <div class="side-item"><div class="icon"></div> Marketplace</div>
    <div class="side-item"><div class="icon"></div> Saved</div>
  </div>

  <div class="fb-main">
    <div class="card mb-4">
      <div class="composer">
        <div class="avatar"></div>
        <div class="input-pill">What's on your mind?</div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-secondary" style="flex:1">🎥 Live video</button>
        <button class="btn btn-secondary" style="flex:1">🖼️ Photo</button>
        <button class="btn btn-secondary" style="flex:1">😊 Feeling</button>
      </div>
    </div>

    <div class="card post">
      <div class="post-header">
        <div class="post-avatar"></div>
        <div>
          <div class="post-name">NovaSoft RW</div>
          <div class="post-meta">3 hrs · 🌐</div>
        </div>
      </div>
      <div class="post-body">Just launched a new dashboard for our Kigali clients. Feedback welcome!</div>
      <div class="post-media"></div>
      <div class="post-stats">
        <span>👍❤️ 128</span>
        <span>24 comments · 6 shares</span>
      </div>
      <div class="post-buttons">
        <button class="liked">👍 Like</button>
        <button>💬 Comment</button>
        <button>↗ Share</button>
      </div>
    </div>
  </div>

  <div class="fb-right">
    <div class="card">
      <div class="post-name mb-3">Contacts</div>
      <div class="side-item"><div class="icon"></div> Elowen Ashvale</div>
      <div class="side-item"><div class="icon"></div> Bram Ironfoot</div>
      <div class="side-item"><div class="icon"></div> Nyx</div>
    </div>
  </div>
</div>

</body>
</html>
