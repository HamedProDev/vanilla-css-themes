<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>instagram-style.css — Demo</title>
<link rel="stylesheet" href="instagram-style.css">
</head>
<body>

<div class="ig-navbar">
  <span class="brand">Fantagram</span>
  <div class="icons">
    <button class="btn btn-text">🏠</button>
    <button class="btn btn-text">✉️</button>
    <button class="btn btn-gradient btn">＋ Create</button>
  </div>
</div>

<div class="app-shell">
  <div class="feed-col">

    <div class="story-row mb-4">
      <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span class="story-label">your_story</span></div>
      <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span class="story-label">elowen.rw</span></div>
      <div class="story"><div class="story-ring seen"><div class="story-avatar"></div></div><span class="story-label">bram_dev</span></div>
      <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span class="story-label">nova.soft</span></div>
    </div>

    <div class="post">
      <div class="post-header">
        <div class="post-avatar"></div>
        <span class="post-username">novasoft.rw</span>
      </div>
      <div class="post-media"></div>
      <div class="post-actions">
        <div class="left">
          <button class="liked">♥</button>
          <button>💬</button>
          <button>➤</button>
        </div>
        <button>🔖</button>
      </div>
      <div class="post-likes">1,204 likes</div>
      <div class="post-caption"><strong>novasoft.rw</strong> Shipping something new from Kigali 🇷🇼</div>
      <div class="post-time">2 hours ago</div>
    </div>

  </div>

  <div class="side-col">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="post-avatar"></div>
      <div>
        <div class="post-username">you</div>
        <div class="text-muted">Your account</div>
      </div>
      <button class="btn btn-text" style="margin-left:auto">Switch</button>
    </div>
    <div class="ig-form">
      <input type="text" placeholder="Search">
      <button class="btn btn-gradient" style="width:100%">Suggested for you</button>
    </div>
  </div>
</div>

</body>
</html>
